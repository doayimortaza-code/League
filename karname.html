<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>کارنامه لیگ موفقیت</title>
<style>
:root{--bg:#f2f5ef;--card:#fff;--ink:#14302a;--muted:#5d726b;--line:#d9e2da;--brand:#0f5c4d;--onbrand:#fff;--gold:#e3a72f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1e1a;--card:#172a25;--ink:#e8f1ed;--muted:#9bb3aa;--line:#27403a;--brand:#1c7a67;--onbrand:#fff;--gold:#f0b94a}}
:root[data-theme="dark"]{--bg:#0f1e1a;--card:#172a25;--ink:#e8f1ed;--muted:#9bb3aa;--line:#27403a;--brand:#1c7a67;--onbrand:#fff;--gold:#f0b94a}
*{box-sizing:border-box}
html{height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Vazirmatn',Tahoma,'Segoe UI',sans-serif;line-height:1.7}
.wrap{max-width:640px;margin:0 auto;padding:28px 16px 16px}
.hero{background:var(--brand);color:var(--onbrand);border-radius:20px;padding:22px 18px;display:flex;gap:14px;align-items:center}
.medal{flex:none;width:56px;height:56px;border-radius:50%;background:var(--gold);display:grid;place-items:center;font-size:28px;box-shadow:0 0 0 5px rgba(255,255,255,.25)}
.hero h1{margin:0;font-size:1.3rem;font-weight:800}
.hero p{margin:4px 0 0;font-size:.92rem;opacity:.92}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.big{font-size:1.25rem}
.muted{color:var(--muted);font-size:.9rem}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center;display:flex;flex-direction:column;gap:2px}
.tile b{font-size:1.1rem}
h2{font-size:1.05rem;margin:22px 0 0}
.row{padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.top{display:flex;justify-content:space-between;gap:8px}
.bar{height:8px;background:var(--line);border-radius:6px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:6px}
textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0}
button{background:var(--brand);color:var(--onbrand);border:0;border-radius:10px;padding:10px 18px;font:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.msg{border:1px solid var(--gold);border-radius:10px;padding:10px;margin-top:12px;background:var(--card)}
.foot{margin-top:24px;text-align:center;color:var(--muted);font-size:.85rem}
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f5c4d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="لیگ موفقیت">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
</head>
<body>
<div class="wrap" id="app"></div>
<script>
var app=document.getElementById('app'),KDF_IT=100000;
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fa(n){return Number(n).toLocaleString('fa-IR',{maximumFractionDigits:2})}
function normPw(t){return String(t||'').replace(/[۰-۹]/g,function(d){return d.charCodeAt(0)-1776}).replace(/[٠-٩]/g,function(d){return d.charCodeAt(0)-1632}).trim()}
function normName(t){return String(t||'').replace(/[يى]/g,'ی').replace(/ك/g,'ک').replace(/[\u064b-\u0652\u0640\u200c\u200f\u200e]/g,'').replace(/\s+/g,' ').trim().toLowerCase()}
function nameOk(typed,full){
  var tt=normName(typed).split(' ').filter(Boolean),ft=normName(full).split(' ').filter(Boolean);
  if(!tt.length)return false;
  if(tt.join('')===ft.join(''))return true;
  return tt.every(function(x){return ft.indexOf(x)>=0});
}
function b64u2u8(s){s=String(s).replace(/\s+/g,'').replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var b=atob(s),u=new Uint8Array(b.length),i;for(i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function decObj(code,pw){
  var b=b64u2u8(String(code).replace(/^E1\./,'')),salt=b.slice(0,16),iv=b.slice(16,28),ct=b.slice(28);
  var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(normPw(pw)),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:KDF_IT,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,ct);
  var d=JSON.parse(new TextDecoder().decode(pt));
  if(!d||d.v!==1||typeof d.n!=='string'||!Array.isArray(d.ex))throw new Error('bad');
  return d;
}
function decLegacy(c){
  c=String(c).replace(/\s+/g,'').replace(/-/g,'+').replace(/_/g,'/');
  while(c.length%4)c+='=';
  var d=JSON.parse(decodeURIComponent(escape(atob(c))));
  if(!d||d.v!==1||typeof d.n!=='string'||!Array.isArray(d.ex))throw new Error('bad');
  return d;
}
function decBoard(c){
  var u=b64u2u8(String(c).replace(/^B1\./,'')),d=JSON.parse(new TextDecoder().decode(u));
  if(!d||d.v!==1||!Array.isArray(d.cond)||!Array.isArray(d.study)||!Array.isArray(d.impr))throw new Error('bad');
  return d;
}
var AW={w:'دانش‌آموز نمونه هفته',c:'دانش‌آموز نمونه اخلاق'};
function hero(t,a,b){return '<header class="hero"><div class="medal" aria-hidden="true">🏆</div><div><h1>'+t+'</h1><p>'+a+(b?'<br>'+b:'')+'</p></div></header>'}
function render(d){
  var h=hero('کارنامه لیگ موفقیت',esc(d.s),esc(d.c)+(d.y?' - '+esc(d.y):''));
  h+='<div class="card"><b class="big">'+esc(d.n)+'</b>'+(d.g?'<div class="muted">گروه: '+esc(d.g)+'</div>':'')+'</div>';
  h+='<div class="tiles"><div class="tile"><span class="muted">مجموع نمره</span><b>'+fa(d.tot)+' از '+fa(d.mx)+'</b></div>';
  if(d.adj)h+='<div class="tile"><span class="muted">تعدیل شایستگی</span><b>'+(d.adj>0?'+':'−')+fa(Math.abs(d.adj))+'</b></div>';
  if(d.rk)h+='<div class="tile"><span class="muted">رتبه در کلاس</span><b>'+fa(d.rk)+' از '+fa(d.cnt)+'</b></div>';
  if(d.avg!=null)h+='<div class="tile"><span class="muted">میانگین مجموع کلاس</span><b>'+fa(d.avg)+'</b></div>';
  if(d.gr)h+='<div class="tile"><span class="muted">رتبه گروه</span><b>'+fa(d.gr)+' از '+fa(d.gc)+'</b></div>';
  h+='</div><h2>نمره‌های آزمون‌ها</h2><div class="card">';
  if(!d.ex.length)h+='<p class="muted">هنوز آزمونی ثبت نشده است.</p>';
  d.ex.forEach(function(e){
    var v=e[3],pct=(v!=null&&e[2]>0)?Math.max(0,Math.min(100,v/e[2]*100)):0;
    h+='<div class="row"><div class="top"><span>'+esc(e[0])+'<br><span class="muted">'+esc(e[1])+'</span></span><b>'+(v==null?'ثبت نشده':fa(v)+' از '+fa(e[2]))+'</b></div>';
    if(v!=null)h+='<div class="bar" aria-hidden="true"><i style="width:'+pct+'%"></i></div>';
    if(e[4]!=null)h+='<div class="muted">میانگین کلاس: '+fa(e[4])+'</div>';
    h+='</div>';
  });
  h+='</div>';
  if(d.pr&&d.pr.length){
    h+='<h2>تمرین‌های ریاضی</h2><div class="card">';
    d.pr.forEach(function(r){h+='<div class="row"><div class="top"><span>'+esc(r[0])+'<br><span class="muted">'+fa(r[2])+' بار تمرین - سطح پیشنهادی: '+esc(r[3])+'</span></span><b>'+fa(r[1])+'٪ درست</b></div></div>'});
    h+='</div>';
  }
  if(d.aw&&d.aw.length){
    h+='<h2>افتخارات</h2><div class="card">';
    d.aw.forEach(function(a){h+='<div class="row">⭐ '+esc(AW[a[0]]||'')+'<br><span class="muted">'+esc(a[1])+(a[2]?' - '+esc(a[2]):'')+'</span></div>'});
    h+='</div>';
  }
  h+='<p class="foot">آموزگار: '+esc(d.t)+(d.d?' · تاریخ تهیه: '+esc(d.d):'')+'<br>این صفحه فقط برای مشاهده است و قابل تغییر نیست.</p>';
  app.innerHTML=h;
}
function renderBoard(d){
  var h=hero('تابلوی افتخارات '+esc(d.m),esc(d.s),esc(d.c));
  function sec(t,arr){if(!arr.length)return '';var o='<h2>'+t+'</h2><div class="card">';arr.forEach(function(n){o+='<div class="row">⭐ '+esc(n)+'</div>'});return o+'</div>'}
  h+=sec('🌟 دانش‌آموزان نمونه اخلاقی',d.cond)+sec('📚 دانش‌آموزان نمونه درسی',d.study)+sec('📈 بیشترین پیشرفت',d.impr);
  h+='<p class="foot">آموزگار: '+esc(d.t)+(d.d?' · تاریخ: '+esc(d.d):'')+'<br>به همه عزیزان تبریک می‌گوییم 🌹</p>';
  app.innerHTML=h;
}
function askCode(err){
  app.innerHTML=hero('کارنامه لیگ موفقیت','دبستان سیدالشهدا')+(err?'<div class="msg" role="status">'+esc(err)+'</div>':'')+'<div class="card"><label for="code">لینک یا کد کارنامه را که آموزگار برایتان فرستاده اینجا بچسبانید</label><textarea id="code" rows="4"></textarea><button id="go">ادامه</button></div>';
  document.getElementById('go').onclick=function(){
    var v=document.getElementById('code').value.trim(),m=v.indexOf('#');if(m>=0)v=v.slice(m+1);
    if(!v)return askCode('کد را بچسبانید.');
    start(v);
  };
}
function askPw(code,err){
  var st='width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);margin:8px 0';
  app.innerHTML=hero('کارنامه لیگ موفقیت','ورود اولیا و دانش‌آموز')+(err?'<div class="msg" role="status">'+esc(err)+'</div>':'')+'<div class="card"><label for="nm">نام دانش‌آموز</label><input id="nm" autocomplete="off" style="'+st+'"><label for="pw">رمز ورود (رمزی که آموزگار به شما داده است)</label><input id="pw" type="password" autocomplete="off" inputmode="text" style="'+st+'"><button id="go">ورود</button></div>';
  var nm=document.getElementById('nm'),pw=document.getElementById('pw'),btn=document.getElementById('go');
  function go(){
    if(!(window.crypto&&crypto.subtle))return askPw(code,'این مرورگر یا آدرس از ورود با رمز پشتیبانی نمی‌کند. لینک را در مرورگر Chrome باز کنید.');
    if(!nm.value.trim()||!pw.value)return askPw(code,'نام دانش‌آموز و رمز را بنویسید.');
    btn.disabled=true;btn.textContent='در حال بررسی...';
    decObj(code,pw.value).then(function(d){
      if(!nameOk(nm.value,d.n))throw new Error('name');
      render(d);
    }).catch(function(){setTimeout(function(){askPw(code,'نام یا رمز درست نیست، یا لینک ناقص است.')},800)});
  }
  btn.onclick=go;pw.onkeydown=function(e){if(e.key==='Enter')go()};
}
function start(v){
  try{
    if(/^E1\./.test(v))return askPw(v);
    if(/^B1\./.test(v))return renderBoard(decBoard(v));
    return render(decLegacy(v));
  }catch(e){askCode('لینک کامل نیست یا کد درست نیست. لینک را از ابتدا تا انتها کپی کنید.')}
}
(function(){
  var m=location.hash.replace(/^#/,'');
  if(m.indexOf('=')>-1&&!/^(E1|B1)\./.test(m))m=m.split('=').slice(1).join('=');
  if(!m)return askCode('');
  start(m);
})();
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
</body>
</html>
