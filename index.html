<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لیگ موفقیت کلاس ششم ۵</title>
<style>
:root{--bg:#f2f5ef;--card:#fff;--ink:#14302a;--muted:#5d726b;--line:#d9e2da;--brand:#0f5c4d;--onbrand:#fff;--gold:#e3a72f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1e1a;--card:#172a25;--ink:#e8f1ed;--muted:#9bb3aa;--line:#27403a;--brand:#1c7a67;--onbrand:#fff;--gold:#f0b94a}}
:root[data-theme="dark"]{--bg:#0f1e1a;--card:#172a25;--ink:#e8f1ed;--muted:#9bb3aa;--line:#27403a;--brand:#1c7a67;--onbrand:#fff;--gold:#f0b94a}
*{box-sizing:border-box}
html{height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Vazirmatn',Tahoma,'Segoe UI',sans-serif;line-height:1.7}
.wrap{max-width:720px;margin:0 auto;padding:28px 16px 16px}
.hero{background:var(--brand);color:var(--onbrand);border-radius:20px;padding:24px 20px;display:flex;gap:16px;align-items:center}
.medal{flex:none;width:64px;height:64px;border-radius:50%;background:var(--gold);display:grid;place-items:center;font-size:32px;box-shadow:0 0 0 5px rgba(255,255,255,.25)}
.hero h1{margin:0;font-size:1.45rem;font-weight:800;line-height:1.4}
.hero p{margin:4px 0 0;font-size:.95rem;opacity:.92}
h2{font-size:1.1rem;margin:24px 0 10px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:560px){.grid{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 8px;text-align:center;font:inherit;color:var(--ink);cursor:pointer;min-height:104px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.tile:active{background:var(--line)}
.tile:focus-visible,.back:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.tile .ic{font-size:30px}
.tile b{font-weight:600;font-size:.95rem}
.view{display:none}
.view.on{display:block}
.back{background:none;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:8px 14px;font:inherit;cursor:pointer;margin-bottom:12px}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:32px 16px;text-align:center}
.empty .ic{font-size:48px}
.foot{margin-top:28px;text-align:center;color:var(--muted);font-size:.85rem}
.btn{background:var(--brand);color:var(--onbrand);border:0;border-radius:10px;padding:10px 16px;font:inherit;cursor:pointer}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:none;color:#c0392b;border:1px solid #c0392b}
.btn.armed{background:#c0392b;color:#fff}
.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin:4px 0 10px}
label{font-size:.9rem;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.badge{background:var(--gold);color:#222;border-radius:8px;padding:2px 10px;font-size:.85rem}
.fs{width:100%;margin:4px 0 10px;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
.sc{width:90px;margin:0;text-align:center}
.msg{background:var(--card);border:1px solid var(--gold);border-radius:10px;padding:10px;margin-bottom:12px}
.strip{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:14px}
.muted{color:var(--muted);font-size:.9rem}
ol{padding:0;margin:0;list-style:none}
.st:last-child{border-bottom:0}
.st{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
</style><link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f5c4d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="لیگ موفقیت">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
</head>
<body>
<div class="wrap" id="app"></div>
<script>
(function(){
  var parts=['app-1.js', 'app-2.js', 'app-3.js', 'app-4.js', 'app-5.js', 'app-6.js', 'app-7.js', 'app-8.js'],total=144437,box=document.getElementById('app');
  function fail(m){box.innerHTML='<div style="padding:24px;font-family:Tahoma,sans-serif;direction:rtl;line-height:2">'+m+'</div>'}
  Promise.all(parts.map(function(p){return fetch(p+'?v=105').then(function(r){if(!r.ok)throw new Error(p);return r.text()})})).then(function(t){
    var all=t.join('\n');
    if(all.length!==total){fail('فایل‌های برنامه کامل نیست. همه فایل‌های app را در GitHub آپلود کنید و صفحه را دوباره باز کنید.');return}
    var s=document.createElement('script');s.textContent=all;document.body.appendChild(s);
  }).catch(function(e){fail('بارگذاری برنامه ناموفق بود: '+e.message+'<br>همه فایل‌های app را در GitHub آپلود کنید و صفحه را دوباره باز کنید.')});
})();
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
</body>
</html>
